services:
  zomato-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zomato-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      zomato-backend:
        condition: service_healthy
    networks:
      - zomato-network

  zomato-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zomato-backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@zomato-postgres:5432/zomato
      - NODE_ENV=production
      - PORT=3000
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-changeme-in-production-access-secret-key-must-be-32-chars-min}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-changeme-in-production-refresh-secret-key-must-be-32-chars-min}
      - CORS_ORIGINS=http://localhost,http://localhost:80
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      zomato-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zomato-network

  zomato-postgres:
    image: postgres:16-alpine
    container_name: zomato-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zomato
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zomato-network

  redis:
    image: redis:7-alpine
    container_name: zomato-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - zomato-network

networks:
  zomato-network:
    driver: bridge

volumes:
  postgres-data:
