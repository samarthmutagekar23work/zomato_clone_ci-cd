sonar.projectKey=zomato-clone
sonar.projectName=Zomato Clone
sonar.projectVersion=1.0.0

sonar.sources=src,frontend/src,backend/src
sonar.tests=src,frontend/src,backend/src
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
    **/node_modules/**,\
    **/build/**,\
    **/dist/**,\
    **/coverage/**,\
    **/*.test.ts,\
    **/*.test.tsx,\
    **/*.spec.ts,\
    **/*.spec.tsx,\
    **/__tests__/**,\
    **/__mocks__/**,\
    **/migrations/**,\
    **/seeds/**,\
    **/vite.config.ts,\
    **/jest.config.ts,\
    **/postcss.config.js,\
    **/tailwind.config.js,\
    **/sonar-project.properties,\
    **/Jenkinsfile,\
    **/docker-compose.yml,\
    **/Dockerfile,\
    **/*.config.js,\
    **/*.config.ts

# Test file inclusions
sonar.test.inclusions=\
    **/*.test.ts,\
    **/*.test.tsx,\
    **/*.spec.ts,\
    **/*.spec.tsx

# Coverage reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Duplicate code exclusions
sonar.cpd.exclusions=\
    **/node_modules/**,\
    **/build/**,\
    **/dist/**,\
    **/coverage/**,\
    **/seeds/**

# Language-specific settings
sonar.typescript.tsconfigPath=backend/tsconfig.json

# Quality gate settings
sonar.qualitygate.wait=false

# Security analysis
sonar.security.hotspots.reviewed=true
