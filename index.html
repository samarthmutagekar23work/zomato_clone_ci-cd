    try { return ALLOWED_API_DOMAINS.includes(new URL(url).hostname); } catch { return false; }

    set: (key, value) => { try { localStorage.setItem(key, value); } catch { } },

    setJSON: (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch { } }

        setToasts(prev => [...prev, { id, message, type: type || 'info' }]);
        setTimeout(() => { setToasts(prev => prev.filter(t => t.id !== id)); }, 3000);
    }, []);
    return React.createElement(ToastContext.Provider, { value: addToast },
        children,

    );
};

    const detectLocation = () => {
        setDetecting(true);
        if (!navigator.geolocation) { setCity('Bangalore'); setDetecting(false); return; }
        navigator.geolocation.getCurrentPosition(
            async ({ coords }) => {
                try {
                    const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + coords.latitude + '&lon=' + coords.longitude, {
                        headers: { 'Accept-Language': 'en' }
                    });
                    const data = await res.json();
                    const detectedCity = data.address?.city || data.address?.town || data.address?.state_district || 'Bangalore';
                    setCity(detectedCity);

                setDetecting(false);

        else { newCart.items.push({ ...item, qty: 1 }); }
        newCart.restaurantId = item.restaurantId || newCart.restaurantId;
        newCart.restaurantName = item.restaurantName || newCart.restaurantName;
        setCart(newCart);
        safeStorage.setJSON('zomato_cart', newCart);
        if (addToast) addToast('Item added to cart!', 'success');
    };

    const removeItem = (id) => {
        const newCart = { ...cart, items: cart.items.filter(i => i.id !== id) };
        if (newCart.items.length === 0) { newCart.restaurantId = null; newCart.restaurantName = ''; }
        setCart(newCart);
